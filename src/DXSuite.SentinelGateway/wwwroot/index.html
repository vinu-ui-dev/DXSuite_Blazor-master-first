<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DXSuite Sentinel Agent</title>
  <style>
    :root { --blue:#0071BC; --ink:#333; --muted:#666; --line:#e0e0e0; --bg:#f5f6f8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI",Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); }
    header { background:var(--blue); color:#fff; padding:16px 24px; font-size:18px; font-weight:600; }
    main { max-width:720px; margin:24px auto; padding:0 16px; display:flex; flex-direction:column; gap:20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:20px; }
    .card h2 { margin:0 0 16px; font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    .badge { display:inline-block; padding:4px 12px; border-radius:14px; font-size:13px; font-weight:600; }
    .badge.on { background:#e8f5e9; color:#2e7d32; }
    .badge.off { background:#f5f5f5; color:#9e2b25; }
    .grid { display:grid; grid-template-columns:max-content 1fr; gap:8px 18px; margin-top:14px; font-size:14px; }
    .grid .k { color:var(--muted); }
    .grid .v { color:var(--ink); }
    form { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
    input { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
    .actions { grid-column:1 / -1; display:flex; align-items:center; gap:12px; }
    button { background:var(--blue); color:#fff; border:none; border-radius:6px; padding:9px 18px; font-size:14px; font-weight:600; cursor:pointer; }
    button:hover { background:#20a6ff; }
    .msg { font-size:13px; }
    .msg.ok { color:#2e7d32; }
    .hint { grid-column:1 / -1; font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
  <header>DXSuite Sentinel Agent</header>
  <main>
    <div class="card">
      <h2>Status</h2>
      <span id="badge" class="badge off">Disconnected</span>
      <div class="grid">
        <div class="k">Broker</div><div class="v" id="broker">—</div>
        <div class="k">Tenant ID</div><div class="v" id="tenantId">—</div>
        <div class="k">Gateway ID</div><div class="v" id="gatewayId">—</div>
        <div class="k">Roles</div><div class="v" id="roles">—</div>
        <div class="k">Version</div><div class="v" id="version">—</div>
        <div class="k">Connected since</div><div class="v" id="connectedSince">—</div>
        <div class="k">Last heartbeat</div><div class="v" id="lastHeartbeat">—</div>
        <div class="k">Commands handled</div><div class="v" id="commandsHandled">—</div>
        <div class="k">Last command</div><div class="v" id="lastCommand">—</div>
        <div class="k">Host CPU / memory</div><div class="v" id="hostMetrics">—</div>
      </div>
    </div>

    <div class="card">
      <h2>Configuration</h2>
      <form id="cfg">
        <div><label>Broker host</label><input id="cBrokerHost" /></div>
        <div><label>Broker port</label><input id="cBrokerPort" type="number" /></div>
        <div><label>Tenant ID</label><input id="cTenantId" /></div>
        <div><label>Gateway ID</label><input id="cGatewayId" type="number" /></div>
        <div><label>Heartbeat (seconds)</label><input id="cHeartbeatSeconds" type="number" /></div>
        <div class="actions">
          <button type="submit">Save</button>
          <span id="msg" class="msg"></span>
        </div>
        <div class="hint">Changes are saved to the agent's appsettings.json and applied when the agent restarts.</div>
      </form>
    </div>
  </main>

  <script>
    function fmt(iso) { return iso ? new Date(iso).toLocaleString() : "never"; }

    async function refresh() {
      try {
        const s = await (await fetch("/api/status")).json();
        const badge = document.getElementById("badge");
        badge.textContent = s.connected ? "Connected" : "Disconnected";
        badge.className = "badge " + (s.connected ? "on" : "off");
        document.getElementById("broker").textContent = s.broker || "—";
        document.getElementById("tenantId").textContent = s.tenantId || "—";
        document.getElementById("gatewayId").textContent = s.gatewayId ?? "—";
        document.getElementById("roles").textContent = s.roles || "—";
        document.getElementById("version").textContent = s.version || "—";
        document.getElementById("connectedSince").textContent = fmt(s.connectedSinceUtc);
        document.getElementById("lastHeartbeat").textContent = fmt(s.lastHeartbeatUtc);
        document.getElementById("commandsHandled").textContent = s.commandsHandled ?? 0;
        document.getElementById("lastCommand").textContent = s.lastCommand ? (s.lastCommand + " @ " + fmt(s.lastCommandUtc)) : "—";
        document.getElementById("hostMetrics").textContent =
          (s.lastCpuPercent != null || s.lastMemoryUsedPercent != null)
            ? `CPU ${s.lastCpuPercent ?? "?"}% · Mem ${s.lastMemoryUsedPercent ?? "?"}%  (@ ${fmt(s.lastTelemetryUtc)})`
            : "— (selfmonitor role off)";
      } catch (e) { /* agent restarting */ }
    }

    async function loadConfig() {
      try {
        const c = await (await fetch("/api/config")).json();
        cBrokerHost.value = c.brokerHost ?? "";
        cBrokerPort.value = c.brokerPort ?? "";
        cTenantId.value = c.tenantId ?? "";
        cGatewayId.value = c.gatewayId ?? "";
        cHeartbeatSeconds.value = c.heartbeatSeconds ?? "";
      } catch (e) {}
    }

    document.getElementById("cfg").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const body = {
        brokerHost: cBrokerHost.value,
        brokerPort: parseInt(cBrokerPort.value) || null,
        tenantId: cTenantId.value,
        gatewayId: parseInt(cGatewayId.value) || null,
        heartbeatSeconds: parseInt(cHeartbeatSeconds.value) || null
      };
      const msg = document.getElementById("msg");
      try {
        const r = await fetch("/api/config", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
        const j = await r.json();
        msg.textContent = j.message || "Saved.";
        msg.className = "msg ok";
      } catch (e) { msg.textContent = "Save failed."; msg.className = "msg"; }
    });

    loadConfig();
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>

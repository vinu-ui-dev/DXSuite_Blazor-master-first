<svg width="680" viewBox="0 0 680 600" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Ideal-state Sentinel monitoring architecture with an MQTT control plane</title>
<desc>DXSuite cloud control plane and an MQTT broker connect to a customer-site edge of DirectorClient players, a site gateway, and probe-only devices. MQTT carries telemetry and commands; HTTPS carries media and cloud polling; LAN probes reach dumb devices.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
.title{font-size:14px;font-weight:600}
.sub{font-size:12px}
.lbl{font-size:14px;fill:#2C2C2A}
.al{font-size:12px;fill:#444441}
.pt{fill:#3C3489}.ps{fill:#534AB7}
.tt{fill:#085041}.tts{fill:#0F6E56}
.bt{fill:#0C447C}.bs{fill:#185FA5}
.gt{fill:#2C2C2A}.gs{fill:#5F5E5A}
</style>
</defs>

<rect x="0" y="0" width="680" height="600" fill="#ffffff"/>

<rect x="40" y="48" width="130" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text class="title gt" x="105" y="66" text-anchor="middle">Operator</text>
<text class="sub gs" x="105" y="81" text-anchor="middle">browser console</text>

<rect x="40" y="110" width="600" height="100" rx="8" fill="none" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text class="lbl" x="52" y="129">DXSuite cloud (multi-tenant)</text>
<rect x="55" y="140" width="120" height="55" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text class="title pt" x="115" y="166" text-anchor="middle">DXSuite host</text>
<text class="sub ps" x="115" y="182" text-anchor="middle">Blazor UI + API</text>
<rect x="190" y="140" width="130" height="55" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text class="title pt" x="255" y="166" text-anchor="middle">Sentinel engine</text>
<text class="sub ps" x="255" y="182" text-anchor="middle">tier 1-3 logic</text>
<rect x="335" y="140" width="120" height="55" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text class="title pt" x="395" y="166" text-anchor="middle">LLM gateway</text>
<text class="sub ps" x="395" y="182" text-anchor="middle">tier 2 diagnosis</text>
<rect x="470" y="140" width="150" height="55" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text class="title pt" x="545" y="166" text-anchor="middle">Per-tenant SQL</text>
<text class="sub ps" x="545" y="182" text-anchor="middle">Director + Sentinel</text>

<rect x="240" y="245" width="200" height="60" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text class="title tt" x="340" y="271" text-anchor="middle">MQTT broker</text>
<text class="sub tts" x="340" y="288" text-anchor="middle">tenant topics + LWT</text>
<rect x="470" y="248" width="170" height="54" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text class="title gt" x="555" y="271" text-anchor="middle">Third-party clouds</text>
<text class="sub gs" x="555" y="288" text-anchor="middle">Ink, Q-SYS, SignageOS</text>

<rect x="40" y="358" width="600" height="160" rx="8" fill="none" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text class="lbl" x="52" y="377">Customer site (edge)</text>
<rect x="60" y="393" width="160" height="70" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
<text class="title bt" x="140" y="423" text-anchor="middle">Site gateway</text>
<text class="sub bs" x="140" y="440" text-anchor="middle">unproven, bridges LAN</text>
<rect x="260" y="393" width="170" height="70" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
<text class="title bt" x="345" y="423" text-anchor="middle">DirectorClient</text>
<text class="sub bs" x="345" y="440" text-anchor="middle">Tizen / WebOS / BrightSign</text>
<rect x="470" y="393" width="150" height="70" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text class="title gt" x="545" y="423" text-anchor="middle">Probe-only devices</text>
<text class="sub gs" x="545" y="440" text-anchor="middle">no agent possible</text>

<line x1="105" y1="88" x2="105" y2="140" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="al" x="112" y="104">WSS</text>

<line x1="300" y1="245" x2="300" y2="195" stroke="#1D9E75" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="al" x="307" y="223">ingest + cmd</text>

<line x1="320" y1="195" x2="480" y2="248" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text class="al" x="398" y="214">poll</text>

<line x1="345" y1="393" x2="345" y2="305" stroke="#1D9E75" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="al" x="352" y="352">state + LWT</text>

<line x1="300" y1="393" x2="120" y2="195" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text class="al" x="46" y="300">manifest + media</text>

<line x1="140" y1="393" x2="270" y2="305" stroke="#1D9E75" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<polyline points="150,463 150,485 535,485 535,463" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="1 4" marker-end="url(#arrow)"/>
<text class="al" x="342" y="480" text-anchor="middle">TCP / ICMP / drivers</text>

<line x1="40" y1="544" x2="72" y2="544" stroke="#1D9E75" stroke-width="2"/>
<text class="lbl" x="80" y="548">MQTT 5 / TLS - push telemetry, LWT, commands</text>
<line x1="40" y1="566" x2="72" y2="566" stroke="#378ADD" stroke-width="2" stroke-dasharray="5 4"/>
<text class="lbl" x="80" y="570">HTTPS / WSS - UI, manifest, media, cloud poll</text>
<line x1="40" y1="588" x2="72" y2="588" stroke="#BA7517" stroke-width="2" stroke-dasharray="1 4"/>
<text class="lbl" x="80" y="592">LAN probes - TCP / ICMP / vendor drivers</text>
</svg>

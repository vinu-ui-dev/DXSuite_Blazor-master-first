site_name: DXSuite Help
site_description: User documentation for the DXSuite digital signage management platform

docs_dir: docs-src
site_dir: src/DXSuite.Host/wwwroot/docs

theme:
  name: material
  custom_dir: docs-src/overrides
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link

# Flat page.html output (not page/index.html) so docs work served from the /docs sub-path
use_directory_urls: false

# Authoring/tooling files live in docs_dir for convenience but must not ship in the served site.
exclude_docs: |
  *.ps1
  requirements.txt
  README.md

extra_css:
  - assets/extra.css

plugins:
  - search
  - offline

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - First Login: getting-started/first-login.md
    - Navigating DXSuite: getting-started/navigation.md
    - Tenants and Locations: getting-started/tenants-and-locations.md
  - Director:
    - Dashboard: director/dashboard.md
    - Scheduling and Media: director/scheduling.md
    - Overrides: director/overrides.md
    - Approvals: director/approvals.md
    - Counter Scheduler: director/counter-scheduler.md
  - Designs:
    - Designs: designs/designs.md
    - Catalog: designs/catalog.md
    - Requirements: designs/requirements.md
  - Locations, Displays and Devices:
    - Locations: infrastructure/locations.md
    - Displays: infrastructure/displays.md
    - Devices: infrastructure/devices.md
  - Screenshots: slc/screenshots.md
  - Pulse: pulse/overview.md
  - Connectors and Integrations:
    - Connector Overview: connectors/overview.md
    - Omnivex Ink Integration: connectors/omnivex.md
  - Configuration:
    - Airlines and Cities: configuration/airlines-cities.md
    - Content Metadata: configuration/metadata.md
  - Administration:
    - Tenants: administration/tenants.md
    - Users and Roles: administration/users-and-roles.md
    - Audit Log: administration/audit-log.md
    - Platform Elevation: administration/elevation.md
  - Troubleshooting: troubleshooting/common-issues.md

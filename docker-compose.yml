# =============================================================================
# DXSuite — local development dependencies
# -----------------------------------------------------------------------------
# EMQX MQTT broker for the Sentinel control plane (gateway + device telemetry).
# Dev only. Start with:   docker compose up -d
# Dashboard:  http://localhost:18083   (user: admin  /  pass: dxsuite-dev)
#
# The Sentinel module connects when Sentinel:Mqtt:Enabled = true (default off).
# Production uses a managed/hardened broker; ACLs + mTLS are layered in later.
# =============================================================================
services:
  emqx:
    image: emqx/emqx:5.8
    container_name: dxsuite-emqx
    restart: unless-stopped
    environment:
      EMQX_NAME: dxsuite-emqx
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "dxsuite-dev"
    ports:
      - "1883:1883"     # MQTT (plaintext — dev/local only)
      - "8883:8883"     # MQTT over TLS
      - "8083:8083"     # MQTT over WebSocket
      - "8084:8084"     # MQTT over Secure WebSocket
      - "18083:18083"   # Management dashboard
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  emqx-data:
  emqx-log:
